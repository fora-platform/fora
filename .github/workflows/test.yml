name: Tests

# Runs the LAS parser test suite on every push and pull request.
# A failing parser test fails this workflow, so parser regressions are caught
# before they can be merged or deployed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run parser tests
        run: npm test
